# Blueprint de Render: despliega los cuatro servicios desde este repositorio.
#
# Cada servicio recibe por variable de entorno la URL de los demas, de modo
# que el mismo codigo funciona en local (127.0.0.1) y en la nube sin cambios.
#
# IMPORTANTE: los servicios se comunican por sus URLs PUBLICAS, no por la red
# privada de Render. En el plan gratuito un servicio puede enviar trafico
# privado pero no recibirlo, asi que `fromService` con `property: hostport`
# no sirve aqui: el agregador no alcanzaria al catalogo.
#
# Render genera el nombre de dominio a partir del nombre del servicio, y ese
# nombre es unico en toda la plataforma. Por eso llevan el sufijo "-iker":
# si el nombre estuviera ocupado, Render anadiria caracteres aleatorios y las
# URLs de abajo dejarian de coincidir. Si cambias un nombre, cambia tambien
# las cuatro URLs correspondientes.

services:
  - type: web
    name: sd-registro-iker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn registro:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLAVE_API
        sync: false

  - type: web
    name: sd-catalogo-iker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn catalogo:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLAVE_API
        sync: false
      - key: URL_REGISTRO
        value: https://sd-registro-iker.onrender.com
      - key: URL_CATALOGO
        value: https://sd-catalogo-iker.onrender.com

  - type: web
    name: sd-rentas-iker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn rentas:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLAVE_API
        sync: false
      - key: URL_REGISTRO
        value: https://sd-registro-iker.onrender.com
      - key: URL_CATALOGO
        value: https://sd-catalogo-iker.onrender.com
      - key: URL_RENTAS
        value: https://sd-rentas-iker.onrender.com

  - type: web
    name: sd-agregador-iker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agregador:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLAVE_API
        sync: false
      - key: URL_REGISTRO
        value: https://sd-registro-iker.onrender.com
      - key: URL_CATALOGO
        value: https://sd-catalogo-iker.onrender.com
      - key: URL_RENTAS
        value: https://sd-rentas-iker.onrender.com
      - key: URL_AGREGADOR
        value: https://sd-agregador-iker.onrender.com
